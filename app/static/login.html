<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — По шагам</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">ПО ШАГАМ</p>
    <h1>С возвращением</h1>
    <p>Войдите, чтобы продолжить работу с задачами.</p>
    <form id="login-form">
      <label>Логин<input name="username" autocomplete="username" required maxlength="200" autofocus></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="1000"></label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button class="primary" type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
