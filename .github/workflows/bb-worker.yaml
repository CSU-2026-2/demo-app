name: worker-build-and-bump

on:
  push:
    branches: [ "main" ]
    paths:
      - "worker/**"
      - "common/**"
      - ".dockerignore"
      - ".github/workflows/bb-worker.yaml"

env:
  CONFIG_REPO: CSU-2026-2/demo-app-helm
  VALUES_FILE: values.yaml
  IMAGE_NAME: demo-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.settag.outputs.image_tag }}
      image_repository: ghcr.io/${{ steps.setowner.outputs.owner_lc }}/${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tag
        id: settag
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Derive lowercase owner
        id: setowner
        run: echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile.kube
          push: true
          cache-from: type=gha,scope=demo-worker
          cache-to: type=gha,scope=demo-worker,mode=max
          tags: |
            ghcr.io/${{ steps.setowner.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ steps.settag.outputs.image_tag }}

  bump:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Checkout Config Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          path: helm-config
          token: ${{ secrets.CONFIG_REPO_PAT }}

      - name: Update image.tag in helm/values.yaml
        id: update_tag
        env:
          NEW_IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
        run: |
          NEW_TAG="${{ needs.build.outputs.image_tag }}"
          CONFIG_PATH="helm-config/${{ env.VALUES_FILE }}"

          curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

          yq eval -i ".worker.image.tag = \"${NEW_TAG}\"" "$CONFIG_PATH"
          yq eval -i '.worker.image.repository = strenv(NEW_IMAGE_REPOSITORY)' "$CONFIG_PATH"

          if [[ $(git -C helm-config status --porcelain) ]]; then
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.update_tag.outputs.files_changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: helm-config
          commit-message: "chore(ci): bump worker image.tag to ${{ needs.build.outputs.image_tag }}"
          title: "Bump worker image.tag to ${{ needs.build.outputs.image_tag }}"
          body: |
            Auto-generated PR: update `values.yaml` to worker image tag `${{ needs.build.outputs.image_tag }}`.

            Merge this PR to trigger Argo CD sync in the cluster.
          branch: ci/bump-worker-image-${{ needs.build.outputs.image_tag }}
          base: main
          labels: ci, automated
          signoff: false
